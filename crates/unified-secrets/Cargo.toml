[package]
name = "unified-secrets"
description = "Credential resolution for the unified tools: environment variables, JSON files and HashiCorp Vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
# Consumed by git tag from unified-api and unified-gitops — never published
# to crates.io
publish = false

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# [dev-dependencies] = compiled only for tests
[dev-dependencies]
serde-saphyr.workspace = true
tempfile.workspace = true
# The Vault tests run a fake Vault: a few axum routes on 127.0.0.1
axum = "0.8"
# test-util adds virtual time (tokio::time::pause): the cache TTL is checked
# in microseconds instead of making the suite wait a minute
tokio = { workspace = true, features = ["test-util"] }
