[package]
name = "auth-rs"
description = "Sign-in for web services: LDAP accounts, access rules, a throttled login, API keys and browser sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
# Consumed by git tag from unified-api and unified-gitops — never published
# to crates.io
publish = false

[dependencies]
secrets-rs.workspace = true
ldap3.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
axum.workspace = true
dashmap.workspace = true
getrandom.workspace = true
subtle.workspace = true

[dev-dependencies]
# to call a router as a service (no TCP)
tower.workspace = true
serde-saphyr.workspace = true
# tokio virtual time (start_paused) for the throttle's delays, and a log
# subscriber so the fields of a logged refusal are evaluated
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = "0.3"
tempfile.workspace = true
